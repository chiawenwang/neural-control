# =============================================================================
# Task P, target P2 (harder): path tracking between two pegs, trajectory
# objective, snap-through rejected -- the scene of configs/task_path_peg_3d.yaml
# (same rod, clamps, horizon, solver, training settings) with two pegs:
#   peg A (clamp side, outside the arc, left of the rising part): the rod is
#     pressed onto it from 58 % of the path to the end (the required contact,
#     2.0 N at the end);
#   peg B (gripper side, inside the arc, under the gripper-side part): the
#     designed motion keeps the rod clear of it; the rod runs between A and B.
# Check (2026-11-25): designed motion snap-free, start rod 15 / 36 mm from
# A / B; the one-step tracker (greedy) on this path presses the rod into B
# (3 mm penetration) and lags up to 50 mm (13.6 mm RMS), while the state-based
# gradient with L-BFGS brings a 14.5 mm initialization to 0.29 mm in 150
# rollouts (seed 0).
# The designed motion (via points of the gripper pose, as the shape targets
# of S) swings the gripper tangent up and back down while moving in: it uses
# the 3 DOF of the pose the mid-node path does not fix. The reference path is
# its mid-node trajectory with both pegs (reachable by construction).
#
#   CONFIG=configs/task_path_pegs2_3d.yaml bash scripts/run_path_batch.sh P2 runs/path_p2 6
# =============================================================================
env:
  dim: 3
  grasp_mode: both              # left end fixed at u_left_*, right end driven
rod:
  material: soft_strip          # EI = 0.127 N*m^2
  twist: true
  nv: 51                        # node spacing 2 cm (< peg radius 3 cm); paper Table: N = 51
  dt: 0.01
  total_time: 2.0               # -> M = 200 control steps
  rod_length: 1.0
  max_newton_iter: 200
  gravity: [0.0, 0.0, -9.81]
start:
  # the clamps of S (configs/task_shape_pegs_3d.yaml): tangent up at the origin,
  # horizontal gripper at (0.62, 0, 0.62), both rolls zero -> untwisted quarter arc
  u_left_3d:  [0.0, 0.0, 0.0, 0.0, 1.5707]
  u_right_3d: [0.62, 0.0, 0.62, 0.0, 0.0]
  u_left_twist:  [0.0, 0.0, 0.0, 0.0, 1.5707, 0.0]
  u_right_twist: [0.62, 0.0, 0.62, 0.0, 0.0, 0.0]
task:
  path_targets:
    P2:
      # gripper pose increments over u0 (dx, dy, dz, dtheta, dphi, dyaw) at lambda, linear in between
      via: [[0.5, -0.05, -0.05, 0.05, 0.0, 0.7, 0.0], [1.0, -0.12, -0.08, -0.06, 0.2, 0.0, 0.0]]
      touch: [0]                # peg A must be touched (from mid-path to the end); B is kept clear
      description: "P2, between two pegs: the rod is pressed onto peg A (clamp side, outside the arc) and runs above peg B (gripper side, inside the arc); the designed motion swings the gripper tangent up and back"
  path_init:                    # common initialization (train_path.py, cf. task.shape_init)
    seed_base: 2000
    rms_band: [0.01, 0.02]      # [m] initial tracking RMS the perturbation is scaled into
    require_contact: true       # the initial trajectory must touch the peg (as the designed one)
    end_pos: 0.02
    end_ang: 0.05
    end_yaw: 0.05
    bump_pos: 0.02
    bump_ang: 0.05
    bump_yaw: 0.05
  path_tracker:                 # the reference tracker: damped least squares with the exact
    damping: 0.03               # per-step mid-node sensitivity (lambda = damping * s_max)
    angle_scale: 0.2            # [m per rad] how angles weigh against positions
    max_step: 0.03              # [m] largest position move per step (the designed motion)
    alphas: [1.0, 0.5, 0.25]    # trial step lengths, each a quasi-static step
peg:
  enabled: true
  center_xz: [-0.040, 0.140]    # A: clamp side, left of the rising part (touched from ~60 % on)
  center_y: -0.029              # the middle of the path's y range
  half_length_y: 0.12
  radius: 0.03
  k_contact: 1.0e+7
  model: smooth
  smoothing: 1.0e-4
  samples_per_edge: 4
  extra:
    - {center_xz: [0.570, 0.550], center_y: -0.029}   # B: gripper side, inside the arc (kept clear)
workspace:
  enabled: true
  position_min_3d: [0.20, -0.40, 0.20]
  position_max_3d: [1.00, 0.40, 0.95]
  orientation_limits_3d: [[-1.0, 1.0], [-1.0, 1.0]]   # theta, phi [rad]
newton:
  continuation: true
  max_substeps: 64
  stability_check: true
  snap_rule: true               # flags snaps (descent or displacement indicator); P rejects them
  predictor: tangent
  max_node_step: 0.02
train:
  grad_method: state            # state (ours) | proxy (frozen tangent)
  optimizer: lbfgs              # lbfgs (ours) | adam
  param: net                    # net | rates (direct rates) | endpose (end pose only, tuned)
  init: designed                # perturbed designed (tracker) motion, fitted
  jac_reg: 0.0
  reject_snap: true             # trajectory objective: a flagged step makes the trial infeasible
  stop_rms: 1.0e-4              # [m] tracking RMS of an admissible rollout (0.1 mm)
  epochs: 500
  max_rollouts: 500
  max_failures: 20
  solve_rms: 2.0e-3             # [m] solved threshold on the tracking RMS (fixed before the runs)
  max_penetration: 5.0e-4
  workspace: reject
  adam:
    lr: 3.0e-4                  # the rate of S, kept (no new sweep)
  lbfgs:
    history: 10
    c1: 1.0e-4
    c2: 0.9
    max_ls: 20
    first_step: 0.1
  device: cpu
output:
  experiment_name: path_pegs2_3d
  save_gif: true
