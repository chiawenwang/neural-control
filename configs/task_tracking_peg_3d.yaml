# =============================================================================
# Path tracking in 3D with gravity and a peg: the mid node follows a gentle
# half-sine in the x-z plane (with a drift in y) while the rod touches a fixed peg.
# Reachability was checked by scripts/check_targets.py; training is not tested.
#
#   python scripts/train_tracking.py --config configs/task_tracking_peg_3d.yaml
#
# Start pose: the rod is already bent, not a taut horizontal line. The left end
# is clamped at the origin pointing straight UP (phi = pi/2), the right gripper
# is horizontal (tangent +x) at (0.62, 0, 0.62): a quarter arc, convex towards
# upper-left (a circle of radius 0.62 m has arc length 0.974 m, so ~2.6 % slack).
# Its mid node sits at (0.150, 0, 0.4625).
#
# Path and peg were CHECKED with scripts/check_targets.py (sampled stable states of
# the free rod, picked a smooth half-sine they support, tracked it on the free rod
# to record the rod's exact shapes, placed the peg on those shapes, then tracked
# the path again with the peg and contact physics on):
#   python scripts/check_targets.py --config configs/task_tracking_peg_3d.yaml
#   x(t) = x0 - 0.125 t, y(t) = -0.12 t, z(t) = z0 + 0.01 sin(pi t),  x0, y0, z0 = (0.150, 0, 0.463)
# With twist on (start.u_*_twist), a damped least-squares tracker followed it with
# rms 0.7 mm (max 5 mm) and the rod was on the peg 79 % of the steps (3 on/off
# changes): it is reachable WITH contact, but contact is the rule here, not the
# exception. Whether the trained policy gets there is a separate question. The
# path is anchored at the ready-pose mid node, so it moves with start.*, rod.twist
# and --ready-dx. The first step (straight rod -> this
# pose) is a large move, hence newton.max_substeps 64.
# =============================================================================
env:
  dim: 3
  grasp_mode: both              # left end fixed at u_left_3d, right end driven
rod:
  material: soft_strip          # EI = 0.127 N*m^2, sags visibly under gravity
  twist: true
  nv: 51                        # node spacing 2 cm
  dt: 0.01
  total_time: 2.0               # -> 200 control steps
  rod_length: 1.0
  max_newton_iter: 1000
  gravity: [0.0, 0.0, -9.81]    # z is up; the rod sags in the x-z plane
start:
  u_left_3d:  [0.0, 0.0, 0.0, 0.0, 1.5708]   # (x, y, z, theta, phi): tangent straight up
  u_right_3d: [0.62, 0.0, 0.62, 0.0, 0.0]    # horizontal gripper, tangent +x
  # read instead of the two lines above when rod.twist: true (a yaw is added to each end);
  # without these the start falls back to the default straight horizontal rod
  u_left_twist:  [0.0, 0.0, 0.0, 0.0, 1.5708, 0.0]
  u_right_twist: [0.62, 0.0, 0.62, 0.0, 0.0, 0.0]
task:
  target_xyz: [0.025, -0.12, 0.47]     # end of the fallback `segment` path only
  tracking:
    trajectory_type: sine_xz
    weight: 1.0
    sine_xz:                    # half a sine period: one smooth bump, no oscillation
      amp: 0.01                 # [m] z; the reachable region is a thin band in x-z, so
                                # z can only follow x (see scripts/check_targets.py)
      periods: 0.5
      dx: -0.125                # x only ever decreases (towards the vertical clamp axis)
      dy: -0.12                 # out of the x-z plane
      bow: 0.0
peg:
  enabled: true
  center_xz: [0.345, 0.618]     # from scripts/check_targets.py, placed on the exact rod shapes of
                                # the free rollout: ~0.2 m from the mid node, above the rod's
                                # upper (gripper-side) part, which it touches during the path
  center_y: -0.060              # the path's y at t = 0.5
  half_length_y: 0.12           # covers y in [-0.18, 0.06]
  radius: 0.03                  # > node spacing 0.02 m
  k_contact: 1.0e+7
workspace:
  enabled: true                 # tracking needs the bounded workspace
  position_min_3d: [0.20, -0.40, 0.20]   # the gripper starts at (0.62, 0, 0.62)
  position_max_3d: [1.00, 0.40, 0.95]
  orientation_limits_3d: [[-1.0, 1.0], [-1.0, 1.0]]   # theta, phi [rad]
newton:
  continuation: true
  max_substeps: 64
  stability_check: true
  snap_rule: true
train:
  grad_method: state
  optimizer: adam
  epochs: 100
  lr: 0.0001                    # 1e-3 oscillated in earlier tracking runs
  device: auto
output:
  experiment_name: tracking_peg_3d
  save_gif: true
