# =============================================================================
# Shape formation, harder target P2: the rod has to HOOK AROUND a peg.
#
#   python scripts/train_shape.py targets --config configs/task_shape_hook_3d.yaml --out DIR
#   bash scripts/run_shape_batch.sh P2 runs/shape_p2 <nproc>   (with CONFIG=configs/task_shape_hook_3d.yaml)
#
# Same rod, clamps and pegs A, B as configs/task_shape_pegs_3d.yaml (P1), plus
# peg C inside the start arc (x, z) = (0.35, 0.40), 119 mm below the start rod.
# The designed motion takes the gripper down the right side of C, under it
# (turning its azimuth to pi, out of the plane) and up on its left: the rod
# comes over the top of C, wraps its right side and curls under it to the
# gripper (contact from 79 to -17 deg around C, 9.4 N), swinging out of the
# plane to y = -0.16 on the way. A straight move to the same end pose would
# have to pass the rod through C (infeasible); without the pegs the designed
# motion ends 160 mm from the target. Designed 2026-11-24.
#
# The gripper workspace is NOT enforced here (train.workspace: record): the
# path leaves the box of P1 (x < 0.2 is not reached, but the azimuth turns
# to pi). Violations are still recorded per run.
# =============================================================================
env:
  dim: 3
  grasp_mode: both              # left end fixed at u_left_*, right end driven
rod:
  material: soft_strip          # EI = 0.127 N*m^2, sags visibly under gravity
  twist: true
  nv: 31                        # node spacing 3.3 cm (< peg radius); a 100-step rollout ~15 s
  dt: 0.01
  total_time: 1.0               # -> 100 control steps, as the S1-S3 experiment
  rod_length: 1.0
  max_newton_iter: 200
  gravity: [0.0, 0.0, -9.81]
start:
  # The fixed clamp points up. Its elevation is 1.5707, just BELOW pi/2: the
  # yaw reference of a clamp (rodframes.gripper_director) is singular at a
  # vertical tangent, and the earlier 1.5708 (pi/2 + 3.7e-6) lay just past it,
  # which flipped the reference by pi and left the start rod with half a turn
  # of twist (Phi = pi, 0.46 J against 0.17 J of bending) -- an accident of
  # rounding. At 1.5707 (0.006 deg from vertical) the rod starts untwisted
  # (Phi = 0) and |Psi| stays below 0.5 rad on P1-P3. Changed 2026-11-24.
  u_left_3d:  [0.0, 0.0, 0.0, 0.0, 1.5707]   # (x, y, z, theta, phi): tangent straight up
  u_right_3d: [0.62, 0.0, 0.62, 0.0, 0.0]    # horizontal gripper, tangent +x
  u_left_twist:  [0.0, 0.0, 0.0, 0.0, 1.5707, 0.0]
  u_right_twist: [0.62, 0.0, 0.62, 0.0, 0.0, 0.0]
task:
  # Common initialization (train.init: designed): the designed motion of the
  # target plus lambda * e + sin(pi lambda) * b on the gripper, e and b drawn
  # per seed from N(0, scale^2); the trajectory is fitted to it. One per
  # (target, seed), shared by every method. Scales: position [m], tangent
  # angles [rad], yaw [rad] -- they set the direction's proportions; the
  # amplitude is calibrated so that the initial RMS is in rms_band, the rod
  # passes every peg on the target's side, and the motion is admissible
  # without a snap (train_shape.calibrated_init, cached in OUT/inits/).
  shape_init:
    seed_base: 1000
    rms_band: [0.03, 0.05]     # [m] initial shape RMS the perturbation is scaled into (RSS: 32-52 mm)
    require_contact: true      # the initial trajectory must end touching every peg (RSS)
    end_pos: 0.02
    end_ang: 0.05
    end_yaw: 0.05
    bump_pos: 0.02
    bump_ang: 0.05
    bump_yaw: 0.05
  shape_targets:
    P2:
      # via points: [lambda, dx, dy, dz, dtheta, dphi, dyaw] over u0 = (0.62, 0, 0.62, 0, 0, 0)
      via:
        - [0.35, -0.07, 0.0, -0.32, 0.0, -0.8, 0.0]                   # down the right side of C
        - [0.65, -0.22, 0.0, -0.36, 1.5707963267948966, -0.3, 0.0]    # under C, azimuth turning
        - [0.85, -0.37, 0.0, -0.34, 3.141592653589793, 0.0, 0.0]       # past C, rod trailing from the right
        - [1.00, -0.40, 0.0, -0.29, 3.141592653589793, 0.5, 0.0]       # up on the left of C, pulling the hook tight
      touch: [2]                    # the target must touch peg C (A, B may be touched)
      description: "hook around peg C: down its right side, under it, up its left; contact from 79 to -17 deg around C"
peg:
  enabled: true
  center_xz: [-0.030, 0.280]    # clamp side: left of the rising part, 30 mm from the start rod
  center_y: 0.0
  half_length_y: 0.25           # a 0.5 m bar across the x-z plane of the start
  radius: 0.04                  # > node spacing 0.033 m
  k_contact: 1.0e+7             # [N/m^2] per unit rod length (smooth model)
  # Contact model (paper Sec. VI-B, since 2026-11-24): edge quadrature with
  # samples_per_edge points, squared-softplus penalty of smoothing length
  # `smoothing`, clearance of the rod SURFACE (rod radius included).
  # model: node is the legacy node-based quadratic penalty (old runs only).
  model: smooth
  smoothing: 1.0e-4             # delta [m]
  samples_per_edge: 4
  extra:
    - {center_xz: [0.160, 0.560], center_y: 0.0}   # gripper side: above the arc, 37 mm from the start rod
    - {center_xz: [0.350, 0.400], center_y: 0.0}   # C: inside the arc, the peg P2 hooks around
workspace:
  enabled: true                 # check_targets.py samples in it; train_shape.py reads train.workspace
  position_min_3d: [0.20, -0.40, 0.20]   # the gripper starts at (0.62, 0, 0.62)
  position_max_3d: [1.00, 0.40, 0.95]
  orientation_limits_3d: [[-1.0, 1.0], [-1.0, 1.0]]   # theta, phi [rad]
newton:
  continuation: true
  max_substeps: 64
  stability_check: true
  snap_rule: true
  predictor: tangent            # first-order predictor of each step's Newton start
  max_node_step: 0.02           # [m] half a peg radius: no jump of the rod across a peg
train:
  grad_method: state            # state (ours) | proxy (frozen tangent baseline)
  optimizer: adam               # adam | lbfgs (RSS protocol; --optimizer overrides)
  param: net                    # net (1-64-64-6 tanh, float64; needs torch) | rates (direct rates, numpy)
  init: designed                # designed: perturbed designed motion, fitted (task.shape_init) | random
  jac_reg: 0.0                  # exact adjoint (no shift of the Hessian)
  # Stop at whichever comes first:
  stop_rms: 1.0e-4              # [m] shape RMS of an admissible rollout (0.1 mm; keep it well below
                                #     solve_rms, or the final errors are censored at the threshold)
  epochs: 500                   # update cap (Adam: 1 rollout per update; L-BFGS: >= 1)
  max_rollouts: 500             # rollout cap, every rollout counted (RSS: 500)
  max_failures: 20              # failed rollouts (RSS: a run stops after 20)
  # Evaluation (fixed before the runs, paper Sec. VII-A):
  solve_rms: 5.0e-3             # [m] solved threshold
  max_penetration: 5.0e-4       # [m] admissible penetration of the rod surface
  workspace: record             # P2: the workspace is not enforced (recorded only)
  adam:
    lr: 3.0e-4                  # from `train_shape.py sweep` on P1, seed 0, frozen tangent (run
                                # 2026-11-24 before the untwisted-start fix; kept by decision, not
                                # re-swept): 1e-4 -> 3.91 mm, 3e-4 -> 1.20 mm (both solved), 1e-3 ->
                                # 32.4, 3e-3 -> 56.3, 1e-2 -> 36.5 mm. `jobs` would use OUT/adam_lr.json
                                # instead if a new sweep wrote one.
  lbfgs:
    history: 10
    c1: 1.0e-4                  # Armijo
    c2: 0.9                     # curvature (strong Wolfe)
    max_ls: 20                  # rollouts per line search
    first_step: 0.1             # norm of the first trial step in xi (empty memory)
  device: cpu
output:
  experiment_name: shape_hook_3d
  save_gif: true
output:
  experiment_name: shape_hook_3d
  save_gif: true
